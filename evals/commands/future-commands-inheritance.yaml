id: cmd-future-inheritance-001
artifact: commands/README.md
intent: Future commands inherit adaptive scheduling, isolation modes, and single-writer governance by referencing dispatch-naming.md instead of duplicating orchestration rules
scenario: |
  A new command is added under commands/ and adapters/command-skills/
