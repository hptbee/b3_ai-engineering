id: cmd-all-canonical-policy-001
artifact: commands/README.md
intent: All 14 public commands and their command-skills adapters reference canonical dispatch-naming.md and native b3 commands with zero legacy wrappers
scenario: |
  Audit all 14 files in commands/b3-*.md and all 14 adapters/command-skills/b3-*/SKILL.md
  Every command references dispatch-naming.md, uses native b3 guard / b3 pr --kebab-case commands, and contains zero .ps1/.sh wrapper or PascalCase flag references
expected_outcome: PASS
