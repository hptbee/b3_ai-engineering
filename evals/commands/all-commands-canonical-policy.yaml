notes: Covers b3-plan, b3-implement, b3-debug, b3-research, b3-audit, b3-review, b3-refactor, b3-verify, b3-review-loop, b3-ship, b3-research-ship, b3-pr-resolve, b3-pr-reply, and b3-pr-comment
