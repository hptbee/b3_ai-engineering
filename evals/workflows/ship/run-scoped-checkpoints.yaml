id: ship-run-scoped-checkpoints-001
artifact: workflows/ship.md
intent: New ship runs must isolate checkpoints under .b3/ship/runs/<run_id>/ via CURRENT instead of overwriting or leaving stale approach files
scenario: |
  A prior run completed under .b3/ship/runs/20261121-2300-old-run/ with approach/T003.md
  User starts /ship with a new 2-task feature
  Agent allocates a new run via b3-guard new-run, updates CURRENT, writes master-plan.md and progress.md in the new run directory, and never reads or deletes sibling runs
expected_outcome: PASS
failure_mode: overwritten-checkpoint-or-stale-approach-residue
notes: Use plain-text CURRENT pointer (never symlink); read only CURRENT and active {RUN_DIR} unless status --all or prune is invoked
