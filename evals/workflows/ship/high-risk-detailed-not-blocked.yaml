id: ship-high-risk-not-blocked-001
artifact: workflows/ship.md
intent: Routine auth, migration, or shared-contract risk must elevate to depth detailed rather than pausing as BLOCKED
scenario: |
  User invokes /b3-ship for a feature adding an authenticated endpoint, a shared contract update, and an additive DB table
  No business ambiguity, no destructive column drop, and no breaking API removal exist
  Agent marks the run BLOCKED at phase end asking the user for approval before coding T001
expected_outcome: FAIL
failure_mode: overbroad-approval-gate
notes: Trigger depth detailed purely on actual risk (API/contract/schema/auth/migration/concurrency/data-integrity/prod/new layer — task count informs scheduling/checkpointing only) + 1-pass pre-code risk review; reserve BLOCKED for ambiguity, destructive/breaking unrequested changes, overlapping dirty files, or external ops
