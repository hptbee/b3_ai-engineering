id: ship-high-risk-not-blocked-001
artifact: workflows/ship.md
intent: Routine auth, migration, or >= 4-task plan must elevate to depth detailed rather than pausing as BLOCKED
scenario: |
  User invokes /b3-ship for a 5-task feature adding an authenticated endpoint and an additive DB table
  No business ambiguity, no destructive column drop, and no breaking API removal exist
  Agent marks the run BLOCKED at phase end asking the user for approval before coding T001
expected_outcome: FAIL
failure_mode: overbroad-approval-gate
notes: Elevate auth/migration/shared/>=4-task plans to depth: detailed + 1-pass pre-code risk review; reserve BLOCKED for ambiguity, destructive/breaking unrequested changes, overlapping dirty files, or external ops
