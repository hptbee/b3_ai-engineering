id: ship-parallel-wave-auto-001
artifact: workflows/ship.md
intent: Automatic wave scheduling must run check-wave --partition when >=2 ready tasks exist, choose the least-expensive safe isolation mode, enforce dirty-scope and protected-path gates, act strictly on selected wave|N| rows, and fall back sequentially without false PARALLEL claims
scenario: |
  Ready queue has T001 (src/api/a.ts), T002 (src/ui/b.tsx), T003 (src/api/a.ts), and T004 reading src/api/a.ts while docs/scratch.md is in initial_dirty_paths
  Parent runs check-wave --partition with --wave-reads, --protected-paths, --ignore-dirty-paths, --check-dirty-scope, and --expected-base-sha, then acts strictly on wave|N| rows (supports singleton wave|1|SEQUENTIAL before wave|2|PARALLEL)
  Choose SHARED_READ_ONLY (TaskId=none/[] + --wave-reads without dummy writes/commits), SHARED_DISJOINT_WRITES only when clean non-'.' disjoint writes and safe shared side effects hold (workers never stage/commit), or ISOLATED_WRITES verified via check-worktree --require-isolated --expected-root --peer-roots (not WORKTREE_OK alone); otherwise fall back to SEQUENTIAL and record last_wave accurately
expected_outcome: PASS
failure_mode: missed-auto-parallel-wave-or-false-parallel-or-unsafe-shared-mutation
notes: Never require user opt-in or infer mode from aggregate WAVE_OK/WAVE_PARTITIONED; validate per-worker diffs via mechanical-check --wave-specs/--worker-changes (never claim ownership verified from UNVERIFIED_COMBINED_ONLY) before single-writer precommit; run post-integration verify-run and cross-unit review
