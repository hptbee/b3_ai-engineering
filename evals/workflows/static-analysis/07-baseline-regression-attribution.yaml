id: static-analysis-baseline-regression-attribution-007
artifact: workflows/references/static-analysis.md
intent: Baseline-aware attribution blocks PASS when a net warning drop masks diff-introduced regressions and separates unchanged warnings as PREEXISTING_BASELINE
scenario: |
  Total repository lint warnings drop from 200 to 195 after fixing 10 legacy warnings while introducing 5 new warnings in diff-touched files
  Workflow compares touched-file/diff-line attribution against baseline, blocks PASS on the 5 diff-introduced regressions instead of trusting raw count deltas, and reports unchanged legacy warnings separately as PREEXISTING_BASELINE
expected_outcome: BLOCKED
failure_mode: net-warning-drop-masking-new-regressions
notes: Prevents legacy cleanup from hiding newly introduced static-analysis defects
