id: static-analysis-dead-code-levels-and-prod-consumer-003
artifact: workflows/references/static-analysis.md
intent: Dead-code triage classifies L1-L4 signals and verifies runtime production consumers separately from unit tests before deleting or blocking L2/L3 symbols
