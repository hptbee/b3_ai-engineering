id: static-analysis-scoped-safe-autofix-and-verify-stale-006
artifact: workflows/references/static-analysis.md
intent: Safe deterministic auto-fix stays inside writable owned allowed-paths, forbids warning suppressions, and triggers re-verification when edits or config changes cause VERIFY_STALE
scenario: |
  A worker runs formatting or safe lint --fix inside owned allowed-paths after check-wave --partition, or edits a lint config after an earlier verify-run receipt
  Only deterministic fixes inside writable allowed-paths (never in read-only /b3-audit or /b3-review, never warning-suppression comments or attributes) are permitted, and any edit invalidating the receipt (VERIFY_STALE) forces fresh b3 guard verify-run before PASS
expected_outcome: PASS
failure_mode: out-of-scope-autofix-warning-suppression-or-stale-receipt-commit
notes: Enforces src/guard/verify.rs receipt invalidation on source and config edits
