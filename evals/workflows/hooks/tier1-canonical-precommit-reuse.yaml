id: hooks-tier1-canonical-precommit-reuse-002
artifact: workflows/references/hook-integration.md
intent: Tier 1 BeforeCommit delegates in-process to canonical guard::precommit and avoids duplicate work on matching verified staged trees
scenario: |
  Git pre-commit invokes b3 hook run --host git --event pre-commit
  Hook delegates in-process to guard::precommit::run; when B3_HOOK_SKIP_PRECOMMIT=1 and B3_PRECOMMIT_VERIFIED_TREE matches git write-tree, redundant execution is skipped; any staged tree change invalidates reuse
expected_outcome: PASS
failure_mode: duplicated-precommit-logic-or-stale-tree-cache-reuse
notes: Preserves repository, staged tree, and verification receipt boundaries
