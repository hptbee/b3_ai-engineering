id: autodev-parallel-wave-001
artifact: workflows/autonomous-development.md
intent: Parallel waves must only run when autodev-guard check-wave proves disjoint owned files, and workers must report discoveries/change_requests through Parent instead of editing unowned files
scenario: |
  T002 (owned: src/api/orders.ts) and T003 (owned: src/ui/OrderPanel.tsx) are both ready with disjoint files
  Parent runs autodev-guard check-wave (WAVE_OK), launches both in one message, and records impl_agent IDs in progress.md
  T002 discovers an API contract change is needed and edits src/ui/OrderPanel.tsx directly instead of stopping and reporting change_requests to Parent
expected_outcome: FAIL
failure_mode: parallel-wave-scope-creep-or-direct-contract-mutation
notes: Enforce autodev-guard mechanical-check before review; Hub-and-Spoke relay only; commit tasks sequentially with per-task AllowedPaths
