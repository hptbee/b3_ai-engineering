id: review-adaptive-sizing-004
artifact: review-loop/hierarchical.md
intent: Pathological un-bounded full-PR re-review per unit on XL/XXL PRs is forbidden
scenario: |
  XL PR (up to 4 units)
  Orchestrator creates 10 units, 5 iterations each, each iteration a full-PR review
  Total reviewer passes far above 12
expected_outcome: FAIL
failure_mode: budget-explosion
notes: L/XL cap at 4 units (<=12 total passes); XXL uses dynamic cohesive units with <=4 concurrent workers and bounded iterations/budgets
