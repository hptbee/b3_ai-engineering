name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast Feedback Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1/master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-fast-1.100.0-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-fast-1.100.0-${{ hashFiles('Cargo.lock') }}-

      - name: Check formatting, lints, and build debug binary
        run: |
          rustc --version
          cargo clippy --version
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo build --bin b3

      - name: Check strict context budget
        run: ./target/debug/b3 context measure --strict

      - name: Run Rust unit tests & eval contracts
        run: cargo test --lib --test eval_contracts

  verify:
    name: Verify (${{ matrix.os }})
    needs: fast-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1/master
        with:
          toolchain: "1.100.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-verify-1.100.0-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs', 'tests/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-verify-1.100.0-${{ hashFiles('Cargo.lock') }}-

      - name: Build release binary
        run: cargo build --release

      - name: Run native CLI smoke checks and strict context budget
        shell: bash
        run: |
          bin="./target/release/b3"
          if [[ -x "./target/release/b3.exe" ]]; then
            bin="./target/release/b3.exe"
          fi
          "$bin" --version
          "$bin" context measure --strict
          "$bin" sync --host antigravity --dry-run
          "$bin" sync --host cursor --dry-run
          "$bin" guard fingerprint --depends-on T2,T1 --scope src/a.rs --criteria ok

      - name: Run all native Rust unit & integration tests
        run: cargo test

  ci-gate:
    name: CI Acceptance Gate
    if: always()
    needs: [fast-gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        shell: bash
        env:
          RES_FAST: ${{ needs.fast-gate.result }}
          RES_VERIFY: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          echo "Job fast-gate: ${RES_FAST}"
          echo "Job verify: ${RES_VERIFY}"
          if [[ "${RES_FAST}" != "success" || "${RES_VERIFY}" != "success" ]]; then
            echo "CI Acceptance Gate FAILED: one or more required jobs did not succeed." >&2
            exit 1
          fi
          echo "CI Acceptance Gate PASSED."
