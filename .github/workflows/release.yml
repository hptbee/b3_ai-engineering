name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build/publish (dry-run upload when empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: b3.exe
            artifact_name: b3-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: b3
            artifact_name: b3-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: b3
            artifact_name: b3-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: b3
            artifact_name: b3-x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          "$bin" --version
          mkdir -p dist
          cp "$bin" "dist/${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          sha256sum b3-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: b3-release-bundle
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/b3-* dist/SHA256SUMS.txt \
            --title "B3 Native CLI ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
